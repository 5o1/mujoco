name: concon-filament-wheel

on:
  push:
    branches:
      - concon/filament-opacity-texture
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-cp312:
    runs-on: ubuntu-22.04
    env:
      TMPDIR: /tmp/mujoco-build
      CMAKE_ARGS: >-
        -G Ninja
        -DCMAKE_C_COMPILER:STRING=clang-18
        -DCMAKE_CXX_COMPILER:STRING=clang++-18
        -DCMAKE_CXX_FLAGS:STRING=-Wno-error=deprecated-declarations
        -DFETCHCONTENT_SOURCE_DIR_EIGEN:PATH=/tmp/eigen-source
        -DFETCHCONTENT_SOURCE_DIR_EIGEN3:PATH=/tmp/eigen-source
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Install pinned Clang 18 toolchain
        run: |
          curl --fail --location --retry 3 \
            https://apt.llvm.org/llvm.sh \
            --output /tmp/llvm.sh
          echo "03878e08f47b66cc95bc4b544b0db3c6d9ce8d60e6cf2492ae357984330a9eae  /tmp/llvm.sh" \
            | sha256sum --check
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 18
          clang-18 --version
          clang++-18 --version

      - name: Prepare Linux build dependencies
        run: bash .github/workflows/build_steps.sh prepare_linux

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          enable-cache: true

      - name: Prepare pinned Eigen source
        run: |
          curl --fail --location --retry 3 \
            https://gitlab.com/libeigen/eigen/-/archive/087757ad50159b5bd86ab73e4df34e6b4ea74258/eigen-087757ad50159b5bd86ab73e4df34e6b4ea74258.tar.gz \
            --output /tmp/eigen.tar.gz
          echo "78634dfdb9ddfcd1fd1f4323d877b00e46d105949c4496607411aa404170c687  /tmp/eigen.tar.gz" \
            | sha256sum --check
          mkdir -p /tmp/eigen-source
          tar -xzf /tmp/eigen.tar.gz --strip-components=1 -C /tmp/eigen-source

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03
        with:
          key: concon-ubuntu22-clang18-filament
          max-size: "500M"

      - name: Prepare Python build environment
        run: |
          mkdir -p "${TMPDIR}"
          bash .github/workflows/build_steps.sh prepare_python

      - name: Build patched Studio/Filament wheel
        run: |
          source "${TMPDIR}/venv/bin/activate"
          bash .github/workflows/build_steps.sh build_studio_python

      - name: Vendor compiler runtime into wheel
        run: |
          source "${TMPDIR}/venv/bin/activate"
          mkdir -p python/wheelhouse
          export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/build/mujoco_install/lib:${LD_LIBRARY_PATH:-}"
          auditwheel repair \
            --plat manylinux_2_35_x86_64 \
            --wheel-dir python/wheelhouse \
            python/dist/mujoco-*.whl
          auditwheel show python/wheelhouse/mujoco-*.whl

      - name: Verify repaired wheel contains Filament modules
        run: |
          source "${TMPDIR}/venv/bin/activate"
          pip install --force-reinstall --no-deps python/wheelhouse/mujoco-*.whl
          python - <<'PY'
          import mujoco
          import mujoco._render_filament
          from mujoco.rendering.filament import renderer

          print(mujoco.__version__)
          print(renderer.__file__)
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mujoco-3.15.0-concon-opacity-cp312-linux
          path: python/wheelhouse/mujoco-*.whl
          if-no-files-found: error
          compression-level: 0
